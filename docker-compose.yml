services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${HOMETUBE_POSTGRES_DB:-hometube}
      POSTGRES_USER: ${HOMETUBE_POSTGRES_USER:-hometube}
      POSTGRES_PASSWORD: ${HOMETUBE_POSTGRES_PASSWORD:?Set HOMETUBE_POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - ${HOMETUBE_POSTGRES_DATA:-/srv/storage/hometube-postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 1g
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${HOMETUBE_POSTGRES_USER:-hometube}:${HOMETUBE_POSTGRES_PASSWORD:?Set HOMETUBE_POSTGRES_PASSWORD}@postgres:5432/${HOMETUBE_POSTGRES_DB:-hometube}
      MEDIA_ROOT: /srv/storage/hometube-media
      MEDIA_TARGET_BYTES: ${MEDIA_TARGET_BYTES:-128849018880}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:-}
      COMPLETION_THRESHOLD: ${COMPLETION_THRESHOLD:-0.9}
      HOME_RECOMMENDATION_TARGET: ${HOME_RECOMMENDATION_TARGET:-40}
      AUTO_DOWNLOAD_COUNT: ${AUTO_DOWNLOAD_COUNT:-8}
      TRIAL_POOL_SIZE: ${TRIAL_POOL_SIZE:-10}
      TRIAL_DAYS: ${TRIAL_DAYS:-21}
      DISCOVERY_CHANNEL_COUNT: ${DISCOVERY_CHANNEL_COUNT:-10}
      DISCOVERY_CADENCE_HOURS: ${DISCOVERY_CADENCE_HOURS:-168}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENDATALOADER_URL: ${OPENDATALOADER_URL:-http://wowzerbowser-opendataloader-hybrid:5002}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    volumes:
      - ${HOMETUBE_MEDIA_ROOT:-/srv/storage/hometube-media}:/srv/storage/hometube-media
    ports:
      - "127.0.0.1:${HOMETUBE_WEB_PORT:-3010}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - wowzerbowser

  worker:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1536m
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${HOMETUBE_POSTGRES_USER:-hometube}:${HOMETUBE_POSTGRES_PASSWORD:?Set HOMETUBE_POSTGRES_PASSWORD}@postgres:5432/${HOMETUBE_POSTGRES_DB:-hometube}
      MEDIA_ROOT: /srv/storage/hometube-media
      MEDIA_TARGET_BYTES: ${MEDIA_TARGET_BYTES:-128849018880}
      COMPLETION_THRESHOLD: ${COMPLETION_THRESHOLD:-0.9}
      HOME_RECOMMENDATION_TARGET: ${HOME_RECOMMENDATION_TARGET:-40}
      AUTO_DOWNLOAD_COUNT: ${AUTO_DOWNLOAD_COUNT:-8}
      TRIAL_POOL_SIZE: ${TRIAL_POOL_SIZE:-10}
      TRIAL_DAYS: ${TRIAL_DAYS:-21}
      DISCOVERY_CHANNEL_COUNT: ${DISCOVERY_CHANNEL_COUNT:-10}
      DISCOVERY_CADENCE_HOURS: ${DISCOVERY_CADENCE_HOURS:-168}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      YTDLP_BINARY: yt-dlp
      OPENDATALOADER_URL: ${OPENDATALOADER_URL:-http://wowzerbowser-opendataloader-hybrid:5002}
    volumes:
      - ${HOMETUBE_MEDIA_ROOT:-/srv/storage/hometube-media}:/srv/storage/hometube-media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - wowzerbowser

  opendataloader-hybrid:
    profiles: ["standalone-ocr"]
    image: ${OPENDATALOADER_IMAGE:-wowzerbowser-opendataloader-hybrid}
    restart: unless-stopped
    environment:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
    cpus: "2.0"
    mem_limit: 3g
    volumes:
      - wowzerbowser-opendataloader-cache:/var/cache/opendataloader
    # Intentionally private. Normal homelab operation reuses the existing
    # Wowzer Bowser OCR container over the external network below; the
    # standalone profile is available only for an isolated installation.

  discord:
    profiles: ["discord"]
    image: ${DISCORD_IMAGE:-alpine:3.20}
    command: ["sh", "-c", "echo Discord profile is optional; configure a real image before enabling it && sleep infinity"]

volumes:
  wowzerbowser-opendataloader-cache:
    name: wowzerbowser-opendataloader-cache

networks:
  wowzerbowser:
    external: true
    name: wowzerbowser-application
